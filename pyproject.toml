[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-download"
version = "0.1.0"
description = "Lightweight, database-free Douyin link parsing and work detail CLI"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
douyin-download = "douyin_download.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
